[build]
  command = "npm run build"
  publish = "dist"

# Build output under /assets/ is content-hashed, so it is safe to cache
# immutably; without this Netlify serves max-age=0 and every navigation
# re-downloads the full bundle.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
